<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Sakura City</title>
  <rect width="600" height="200" fill="#000000"/>
  <defs>
    <linearGradient id="lotusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="45%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- 8=8<0;8AB8G=K9 ;>B>A: 6 ;5?5AB:>2, B>=:85 ;8=88 -->
  <g transform="translate(300, 48)">
    <g fill="url(#lotusGrad)" stroke="#fda4af" stroke-width="0.35" opacity="0.98">
      <path d="M0,-22 C-11,-8 -11,8 0,18 C11,8 11,-8 0,-22"/>
      <path d="M0,-22 C-11,-8 -11,8 0,18 C11,8 11,-8 0,-22" transform="rotate(60)"/>
      <path d="M0,-22 C-11,-8 -11,8 0,18 C11,8 11,-8 0,-22" transform="rotate(120)"/>
      <path d="M0,-22 C-11,-8 -11,8 0,18 C11,8 11,-8 0,-22" transform="rotate(180)"/>
      <path d="M0,-22 C-11,-8 -11,8 0,18 C11,8 11,-8 0,-22" transform="rotate(240)"/>
      <path d="M0,-22 C-11,-8 -11,8 0,18 C11,8 11,-8 0,-22" transform="rotate(300)"/>
    </g>
    <circle cx="0" cy="0" r="3.5" fill="#fef2f2" opacity="0.85"/>
  </g>
  <text
    x="300"
    y="150"
    text-anchor="middle"
    fill="#e4e4e7"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="26"
